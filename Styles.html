<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6d7781;--line:#dce2e7;--primary:#17324d;--accent:#1e6f5c;--danger:#b33131;--warn:#9a6a00;--radius:18px;}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}body{padding-bottom:30px}
.topbar{background:var(--primary);color:#fff;padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 14px #0002}.topbar h1{font-size:22px;margin:2px 0 0}.eyebrow{font-size:10px;letter-spacing:2px;opacity:.7}.icon-btn{border:0;background:#fff2;color:#fff;border-radius:12px;width:42px;height:42px;font-size:24px}
.app-shell{width:min(1100px,100%);margin:auto;padding:10px 14px 30px}.tabs{display:flex;gap:6px;overflow:auto;padding:7px 0;position:sticky;top:80px;background:var(--bg);z-index:9}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;white-space:nowrap;color:var(--muted)}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none}.panel.active{display:block}.hero-card{margin-top:12px;background:var(--primary);color:#fff;border-radius:var(--radius);padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero-card h2{font-size:44px;line-height:1;margin:6px 0}.muted{color:var(--muted);font-size:13px}.hero-card .muted{color:#d3dde6}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.stat,.counter-card,.truck-card,.asset-row,.summary-list,.mini-summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:26px;display:block;margin-top:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}.section-head h2,.section-head h3{margin:0}.section-head p{margin:3px 0 0}.link-btn,.secondary{border:1px solid var(--line);background:#fff;color:var(--primary);border-radius:12px;padding:10px 12px}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;font-weight:700}.wide{width:100%;margin-top:4px}.filter-row{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin:10px 0}.filter-row>*{min-width:0}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 12px;outline:none}textarea{resize:vertical}.counter-card{padding:16px;margin-top:12px}.counter-card label{font-size:12px;font-weight:700;display:block;margin:10px 0 6px}.optional{font-weight:400;color:var(--muted)}.quick-count{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;text-align:center;margin:14px 0}.counter-btn{height:58px;border:1px solid var(--line);background:#f9fafb;border-radius:15px;font-size:28px}.quick-count strong{display:block;font-size:30px}.quick-count span{display:block;font-size:11px;color:var(--muted)}
.card-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.truck-card{overflow:hidden}.truck-photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#edf0f3;display:block}.truck-body{padding:13px}.truck-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.truck-id{font-size:18px;font-weight:800}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.good{background:#dff2e8;color:#236644}.repair{background:#fff2cf;color:#7d5900}.damaged{background:#fde0e0;color:#9b2929}.out{background:#e5e7eb;color:#4b5563}.other{background:#e7edf5;color:#30475e}.meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}.truck-actions{display:flex;gap:7px;margin-top:12px}.small-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.danger-btn{border-color:#edcccc;color:var(--danger)}
.summary-list{overflow:hidden}.asset-row{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 15px;display:flex;justify-content:space-between}.asset-row:last-child{border-bottom:0}.asset-count{font-weight:800}.mini-summary{display:flex;gap:10px;flex-wrap:wrap;padding:10px}.mini-pill{padding:7px 10px;border-radius:999px;background:#f1f4f6;font-size:12px}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:8px}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:100}.modal-box{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;position:relative}.modal-close{position:absolute;right:13px;top:9px;border:0;background:#f0f2f4;border-radius:50%;width:35px;height:35px;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.modal-title{margin:0 35px 14px 0}.image-large{width:100%;max-height:500px;object-fit:contain;border-radius:14px;background:#f3f4f6}.empty{border:1px dashed #cdd5dc;border-radius:16px;padding:28px;text-align:center;color:var(--muted);background:#fff}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#19232d;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;z-index:200}.spinner{width:42px;height:42px;border:4px solid #fff6;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sticky-head{position:sticky;top:128px;background:var(--bg);z-index:5;padding:10px 0}.danger-text{color:var(--danger)}
@media(max-width:760px){.topbar{padding:15px 14px}.tabs{top:70px}.card-list{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}.filter-row{grid-template-columns:1fr}.hero-card{align-items:flex-start;flex-direction:column}.sticky-head{top:117px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style>
