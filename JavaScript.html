<script>
const state = { pumpTrucks: [], assetCounts: [], assetTypes: [], counterQty: 1, editId: null };

const $ = id => document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function showLoading(show,text='Saving…'){ $('loading').classList.toggle('hidden',!show); $('loadingText').textContent=text; }
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function err(e){showLoading(false);toast((e&&e.message)||'Something went wrong');console.error(e);}
function gas(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));}

function init(){
  bindTabs();
  $('refreshBtn').onclick=load;
  $('addPumpBtn').onclick=()=>openPumpModal();
  $('saveAssetBtn').onclick=saveAsset;
  $('addTypeBtn').onclick=addAssetType;
  $('plusCount').onclick=()=>setQty(state.counterQty+1);
  $('minusCount').onclick=()=>setQty(Math.max(1,state.counterQty-1));
  $('pumpConditionFilter').onchange=renderPump;
  $('pumpSearch').oninput=renderPump;
  $('historyType').onchange=renderHistory;
  $('historySearch').oninput=renderHistory;
  $('modalClose').onclick=closeModal;
  $('modal').onclick=e=>{if(e.target===$('modal'))closeModal();};
  $('assetPhoto').onchange=()=>previewFile($('assetPhoto'),$('assetPreview'));
  document.addEventListener('click',e=>{
    const go=e.target.closest('[data-go]'); if(go) switchTab(go.dataset.go);
  });
  load();
}

async function load(){
  showLoading(true,'Loading warehouse data…');
  try{const data=await gas('getData');state.pumpTrucks=data.pumpTrucks||[];state.assetCounts=data.assetCounts||[];state.assetTypes=data.assetTypes||[];renderAll();}
  catch(e){err(e)}finally{showLoading(false);}
}
function renderAll(){renderAssetTypes();renderDashboard();renderPump();renderAssetSummary();renderHistory();}
function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));}
function switchTab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===name));window.scrollTo({top:0,behavior:'smooth'});}
function renderAssetTypes(){
  const sel=$('assetType');sel.innerHTML=state.assetTypes.map(t=>`<option>${esc(t)}</option>`).join('');
  if(!state.assetTypes.length) sel.innerHTML='<option value="">Add an asset type first</option>';
}
function conditionClass(c){return ({'Good':'good','Needs Repair':'repair','Damaged':'damaged','Out of Service':'out','Other':'other'}[c]||'other');}
function fmtDate(v){const d=new Date(v);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function imageOrPlaceholder(url){return url?`<img class="truck-photo" src="${esc(url)}" loading="lazy" alt="Asset photo">`:'<div class="truck-photo"></div>';}

function renderDashboard(){
  const p=state.pumpTrucks;
  $('dashTotal').textContent=p.length;
  $('dashGood').textContent=p.filter(x=>x['Condition']==='Good').length;
  $('dashRepair').textContent=p.filter(x=>x['Condition']==='Needs Repair').length;
  $('dashDamaged').textContent=p.filter(x=>x['Condition']==='Damaged').length;
  $('dashOther').textContent=p.filter(x=>!['Good','Needs Repair','Damaged'].includes(x['Condition'])).length;
  const totals=assetTotals();
  $('assetSummary').innerHTML=Object.keys(totals).length?Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="asset-row"><span>${esc(k)}</span><span class="asset-count">${v}</span></div>`).join(''):'<div class="empty">No asset counts yet.</div>';
  const recent=[...p].reverse().slice(0,6); $('dashRecent').innerHTML=recent.length?recent.map(pumpCard).join(''):'<div class="empty">No pump trucks recorded yet.</div>';
}
function renderPump(){
  const filter=$('pumpConditionFilter').value.toLowerCase(), search=$('pumpSearch').value.trim().toLowerCase();
  const rows=state.pumpTrucks.filter(p=>(!filter||String(p['Condition']).toLowerCase()===filter)&&(!search||[p['Pump Truck ID'],p['Pump Truck Type'],p['Area'],p['Tags']].join(' ').toLowerCase().includes(search)));
  const counts={};state.pumpTrucks.forEach(p=>counts[p['Condition']]=(counts[p['Condition']]||0)+1);
  $('pumpMiniSummary').innerHTML=Object.entries(counts).map(([k,v])=>`<span class="mini-pill"><b>${v}</b> ${esc(k)}</span>`).join('')||'<span class="muted">No pump trucks recorded.</span>';
  $('pumpList').innerHTML=rows.length?rows.map(pumpCard).join(''):'<div class="empty">No pump trucks match this filter.</div>';
}
function pumpCard(p){
  const id=esc(p['Pump Truck ID']);
  return `<article class="truck-card">${imageOrPlaceholder(p['Image URL'])}<div class="truck-body"><div class="truck-top"><span class="truck-id">${id}</span><span class="badge ${conditionClass(p['Condition'])}">${esc(p['Condition']||'Other')}</span></div><div class="meta"><b>Type:</b> ${esc(p['Pump Truck Type']||'—')}<br><b>Area:</b> ${esc(p['Area']||'—')}<br><b>Tag:</b> ${esc(p['Tags']||'—')}<br>${esc(p['Notes']||'')}<br>${fmtDate(p['Date/Time'])}</div><div class="truck-actions"><button class="small-btn" onclick="openPumpView('${id}')">View</button><button class="small-btn" onclick="openPumpModal('${id}')">Edit</button><button class="small-btn danger-btn" onclick="removePump('${id}')">Delete</button></div></div></article>`;
}

function assetTotals(){const out={};state.assetCounts.forEach(r=>{const k=r['Asset Type']||'Unknown';out[k]=(out[k]||0)+Number(r['Quantity']||0);});return out;}
function renderAssetSummary(){
  const totals=assetTotals();$('assetCounterSummary').innerHTML=Object.keys(totals).length?Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="asset-row"><span>${esc(k)}</span><span class="asset-count">${v}</span></div>`).join(''):'<div class="empty">Start counting assets to build the totals.</div>';
}
function renderHistory(){
  const typ=$('historyType').value, search=$('historySearch').value.toLowerCase();
  let rows=[];
  if(typ!=='asset') rows=rows.concat(state.pumpTrucks.map(r=>({...r,__kind:'pump'})));
  if(typ!=='pump') rows=rows.concat(state.assetCounts.map(r=>({...r,__kind:'asset'})));
  rows=rows.filter(r=>!search||JSON.stringify(r).toLowerCase().includes(search)).sort((a,b)=>new Date(b['Date/Time'])-new Date(a['Date/Time']));
  $('historyList').innerHTML=rows.length?rows.map(r=>r.__kind==='pump'?historyPump(r):historyAsset(r)).join(''):'<div class="empty">No history found.</div>';
}
function historyPump(p){return `<article class="truck-card"><div class="truck-body"><div class="truck-top"><span class="truck-id">${esc(p['Pump Truck ID'])}</span><span class="badge ${conditionClass(p['Condition'])}">Pump Truck</span></div><div class="meta">${esc(p['Pump Truck Type'])} · ${esc(p['Condition'])}<br>${esc(p['Area']||'')}<br>${fmtDate(p['Date/Time'])}</div><button class="small-btn" onclick="openPumpView('${esc(p['Pump Truck ID'])}')">View</button></div></article>`;}
function historyAsset(r){return `<article class="truck-card"><div class="truck-body"><div class="truck-top"><span class="truck-id">${esc(r['Asset Type'])}</span><span class="badge other">+${Number(r['Quantity']||0)}</span></div><div class="meta">${esc(r['Area']||'')} · ${esc(r['Tags']||'')}<br>${fmtDate(r['Date/Time'])}</div>${r['Image URL']?`<button class="small-btn" onclick="openAssetView('${esc(r['Record ID'])}')">View</button>`:''}<button class="small-btn danger-btn" onclick="removeAsset('${esc(r['Record ID'])}')">Delete</button></div></article>`;}

function openPumpView(id){const p=state.pumpTrucks.find(x=>String(x['Pump Truck ID'])===String(id));if(!p)return;openModal(`<h2 class="modal-title">${esc(p['Pump Truck ID'])}</h2>${p['Image URL']?`<img class="image-large" src="${esc(p['Image URL'])}" alt="Pump truck photo">`:''}<div class="meta" style="margin-top:14px"><b>Type:</b> ${esc(p['Pump Truck Type'])}<br><b>Condition:</b> ${esc(p['Condition'])}<br><b>Area:</b> ${esc(p['Area']||'—')}<br><b>Tags:</b> ${esc(p['Tags']||'—')}<br><b>Notes:</b> ${esc(p['Notes']||'—')}<br><b>Recorded:</b> ${fmtDate(p['Date/Time'])}</div>`);}
function openAssetView(id){const r=state.assetCounts.find(x=>String(x['Record ID'])===String(id));if(!r)return;openModal(`<h2 class="modal-title">${esc(r['Asset Type'])} × ${Number(r['Quantity']||0)}</h2>${r['Image URL']?`<img class="image-large" src="${esc(r['Image URL'])}" alt="Asset photo">`:''}<div class="meta" style="margin-top:14px"><b>Area:</b> ${esc(r['Area']||'—')}<br><b>Tags:</b> ${esc(r['Tags']||'—')}<br><b>Notes:</b> ${esc(r['Notes']||'—')}<br><b>Counted:</b> ${fmtDate(r['Date/Time'])}</div>`);}

function openPumpModal(id=null){
  state.editId=id; const p=id?state.pumpTrucks.find(x=>String(x['Pump Truck ID'])===String(id)):null;
  openModal(`<h2 class="modal-title">${p?'Edit '+esc(id):'Add Pump Truck'}</h2><div class="form-grid"><div><label>Pump truck type</label><input id="mPumpType" value="${esc(p?.['Pump Truck Type']||'')}" placeholder="e.g. Standard / Electric"></div><div><label>Condition</label><select id="mPumpCondition"><option>Good</option><option>Needs Repair</option><option>Damaged</option><option>Out of Service</option></select></div><div><label>Area / zone</label><input id="mPumpArea" value="${esc(p?.['Area']||'')}" placeholder="e.g. Zone A"></div><div><label>Tag</label><input id="mPumpTags" value="${esc(p?.['Tags']||'')}" placeholder="e.g. wheel, handle"></div><div class="full"><label>Photo</label><input id="mPumpPhoto" type="file" accept="image/*" capture="environment"><img id="mPumpPreview" class="preview ${p?.['Image URL']?'':'hidden'}" src="${esc(p?.['Image URL']||'')}" alt="Preview"></div><div class="full"><label>Notes</label><textarea id="mPumpNotes" rows="3">${esc(p?.['Notes']||'')}</textarea></div><div class="full"><button id="savePumpBtn" class="primary wide">${p?'Save changes':'Save pump truck'}</button></div></div>`);
  if(p)$('mPumpCondition').value=p['Condition']||'Good';
  $('mPumpPhoto').onchange=()=>previewFile($('mPumpPhoto'),$('mPumpPreview'));
  $('savePumpBtn').onclick=savePump;
}

async function savePump(){
  const type=$('mPumpType').value.trim(), condition=$('mPumpCondition').value, area=$('mPumpArea').value.trim();
  if(!type||!condition){toast('Enter the pump truck type and condition.');return;}
  showLoading(true,state.editId?'Updating pump truck…':'Saving pump truck…');
  try{
    const photo=await fileToDataUrl($('mPumpPhoto').files[0]);
    const rec={type,condition,area,tags:$('mPumpTags').value.trim(),notes:$('mPumpNotes').value.trim(),imageData:photo?.dataUrl||'',imageName:photo?.name||'pump-truck.jpg'};
    const res=state.editId?await gas('updatePumpTruck',state.editId,rec):await gas('savePumpTruck',rec);
    closeModal(); await load(); toast(state.editId?'Pump truck updated.':'Saved '+res.record['Pump Truck ID']);
  }catch(e){err(e)}finally{showLoading(false);}
}

async function removePump(id){
  if(!confirm(`Delete ${id}? This removes its record and stored photo.`))return;
  showLoading(true,'Deleting…');try{await gas('deletePumpTruck',id);await load();toast('Pump truck deleted.');}catch(e){err(e)}finally{showLoading(false);}
}
async function removeAsset(id){
  if(!confirm('Delete this asset count record?'))return;
  showLoading(true,'Deleting…');try{await gas('deleteAssetRecord',id);await load();toast('Asset count deleted.');}catch(e){err(e)}finally{showLoading(false);}
}

async function saveAsset(){
  const type=$('assetType').value;if(!type){toast('Choose an asset type first.');return;}
  showLoading(true,'Saving asset count…');
  try{const photo=await fileToDataUrl($('assetPhoto').files[0]);await gas('saveAssetCount',{type,quantity:state.counterQty,area:$('assetArea').value.trim(),tags:$('assetTags').value.trim(),notes:$('assetNotes').value.trim(),imageData:photo?.dataUrl||'',imageName:photo?.name||'asset-photo.jpg'});resetAssetForm();await load();toast('Asset count saved.');}catch(e){err(e)}finally{showLoading(false);}
}
function resetAssetForm(){setQty(1);$('assetArea').value='';$('assetTags').value='';$('assetNotes').value='';$('assetPhoto').value='';$('assetPreview').classList.add('hidden');}
async function addAssetType(){const type=prompt('New asset type:');if(!type)return;showLoading(true,'Adding asset type…');try{await gas('addAssetType',type);await load();$('assetType').value=type.trim();toast('Asset type added.');}catch(e){err(e)}finally{showLoading(false);}}
function setQty(n){state.counterQty=n;$('countValue').textContent=n;}

function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');$('modalContent').innerHTML='';state.editId=null;}
function previewFile(input,img){if(!input.files[0])return;const u=URL.createObjectURL(input.files[0]);img.src=u;img.classList.remove('hidden');}
function fileToDataUrl(file){
  if(!file)return Promise.resolve(null);
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{
      const img=new Image();img.onload=()=>{
        const max=1600;const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve({name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',dataUrl:c.toDataURL('image/jpeg',.75)});
      };img.onerror=reject;img.src=reader.result;
    };reader.readAsDataURL(file);
  });
}

window.addEventListener('load',init);
</script>
